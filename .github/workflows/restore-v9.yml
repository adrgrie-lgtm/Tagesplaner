name: v9 wiederherstellen
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-v9.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-v9

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: v9-Dateien laden
        run: |
          set -e
          cd docs
          for f in index.html manifest.json sw.js icon.svg icon-192.png icon-512.png push-setup-trigger.txt; do
            curl -fsSL "https://raw.githubusercontent.com/adrgrie-lgtm/Tagesplaner-final/main/docs/$f" -o "$f"
          done
      - name: Committen und pushen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "adrgrie-lgtm"
          git config user.email "adrgrie@gmail.com"
          git add -A docs/
          if git diff --cached --quiet; then echo "Keine Aenderungen"; exit 0; fi
          git commit -m "chore: vollstaendige v9 wiederherstellen (Todos, Einkauf, Vorschlaege, Erinnerungen) [skip ci]"
          if git push origin main; then
            echo "PUSH_MAIN_OK"
          else
            echo "main geschuetzt, PR-Weg"
            git checkout -b restore-v9
            git push origin restore-v9
            gh pr create --title "v9 wiederherstellen" --body "Automatisch erstellt" --base main --head restore-v9
          fi